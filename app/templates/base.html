<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Betting Value Finder{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="min-h-full">
    <div class="min-h-full">
      <header class="border-b border-slate-800 bg-slate-900">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
          <div>
            <p class="text-lg font-semibold">Sports Betting Value Finder</p>
            <p class="text-sm text-slate-400">Arbitrage & value opportunity tracker</p>
          </div>
          <nav class="flex gap-4 text-sm text-slate-300">
            <a href="/" class="hover:text-white">Dashboard</a>
          </nav>
        </div>
      </header>
      <main class="mx-auto max-w-6xl px-4 py-6">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script>
      function makeSortable(table) {
        const headers = table.querySelectorAll('th[data-sort]');
        headers.forEach((header, index) => {
          header.addEventListener('click', () => {
            const direction = header.dataset.direction === 'asc' ? 'desc' : 'asc';
            header.dataset.direction = direction;
            const rows = Array.from(table.querySelectorAll('tbody tr'));
            rows.sort((a, b) => {
              const aText = a.children[index].innerText.trim();
              const bText = b.children[index].innerText.trim();
              const aNum = parseFloat(aText.replace(/[^0-9.-]+/g, ''));
              const bNum = parseFloat(bText.replace(/[^0-9.-]+/g, ''));
              const valueA = Number.isNaN(aNum) ? aText : aNum;
              const valueB = Number.isNaN(bNum) ? bText : bNum;
              if (valueA < valueB) return direction === 'asc' ? -1 : 1;
              if (valueA > valueB) return direction === 'asc' ? 1 : -1;
              return 0;
            });
            rows.forEach((row) => table.querySelector('tbody').appendChild(row));
          });
        });
      }

      document.querySelectorAll('table[data-sortable="true"]').forEach(makeSortable);
    </script>
    <script src="/static/js/charts.js"></script>
  </body>
</html>
