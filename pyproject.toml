# =============================================================================
# pyproject.toml - Python project configuration and tooling
# =============================================================================
# This file configures code quality tools like black, ruff, mypy, and pytest
# =============================================================================

[project]
name = "betting-value-finder"
version = "1.0.0"
description = "Sports betting odds aggregator with arbitrage and value bet detection"
readme = "README.md"
requires-python = ">=3.11"

# -----------------------------------------------------------------------------
# Black - Code Formatter
# -----------------------------------------------------------------------------
# Run with: black .
# Check without changing: black --check .
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | \.pytest_cache
    | instance
)/
'''

# -----------------------------------------------------------------------------
# Ruff - Fast Python Linter (replaces flake8, isort, and more)
# -----------------------------------------------------------------------------
# Run with: ruff check .
# Auto-fix: ruff check --fix .
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "instance",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# -----------------------------------------------------------------------------
# Mypy - Static Type Checker
# -----------------------------------------------------------------------------
# Run with: mypy app
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Set to true for stricter checking
ignore_missing_imports = true  # Don't error on untyped third-party libs
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "tests",
]

# -----------------------------------------------------------------------------
# Pytest - Testing Framework
# -----------------------------------------------------------------------------
# Run with: pytest
# With coverage: pytest --cov=app --cov-report=term-missing
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# -----------------------------------------------------------------------------
# Coverage - Code Coverage Reporting
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["app/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
